{% load static %}
<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>{% block titulo %}Bitácora de la Resistencia{% endblock %}</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />

        <!-- Tu CSS propio -->
        <link rel="stylesheet" href="{% static 'css/mision.css' %}" />

        {% block extra_css %}{% endblock %}
    </head>

    <body>
        <header class="text-center py-3">
            <img src="{% static 'images/logo.png' %}" alt="Logo" style="width: 80px; border-radius: 50%;">
            <h1>Bitácora de la Resistencia</h1>
        </header>

        <main class="container">
            {% block contenido %}{% endblock %}
        </main>

        <footer class="text-center py-3">
            <!-- place footer here -->
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
